#
# balanced-cool: Fedora "balanced" with a calmer CPU on the MSI GF63 12VE.
# Measured 2026-08-29, all-core load:  stock  3.5 GHz / 58 W / 97 C (throttling)
#                                       this   ~2.9 GHz / 38 W / ~86 C (power-capped)
# Gaming (GW2, ~30 W pkg): EPP 160 capped cores at 2.3 GHz; balance_performance gives 3.0-3.9 GHz.
# Revert (quick):  sudo tuned-adm profile balanced
# Remove fully:    sudo rm -r /etc/tuned/profiles/balanced-cool && sudo sed -i "s/^balanced=balanced-cool$/balanced=balanced/; s/^performance=balanced$/performance=throughput-performance/" /etc/tuned/ppd.conf && sudo systemctl restart tuned-ppd && sudo tuned-adm profile balanced
# UI:              desktop power mode "Balanced" = this profile, "Performance" = stock
#
[main]
include=balanced
summary=Balanced with cooler CPU (3.5 GHz ceiling, 38 W sustained power cap)

[cpu]
# Keep stock EPP: numeric 160 held partial loads (games) at ~2.3 GHz. The RAPL cap below does the cooling.
energy_performance_preference=balance_performance

[sysfs]
# P-core ceiling 3.5 GHz (stock 4.4). In-game the top 600 MHz cost ~5 W and 5-10 C for a few % fps;
# with the ceiling GW2 runs a steady 3.5 GHz at 84-85 C instead of 3.5-4.1 GHz oscillating at 89-95 C.
/sys/devices/system/cpu/cpufreq/policy*/scaling_max_freq=3500000
# Intel RAPL package limits: PL1 (sustained) 38 W, PL2 (burst) 48 W. Stock is 55 W / 200 W.
/sys/class/powercap/intel-rapl/intel-rapl:0/constraint_0_power_limit_uw=38000000
/sys/class/powercap/intel-rapl/intel-rapl:0/constraint_1_power_limit_uw=48000000
