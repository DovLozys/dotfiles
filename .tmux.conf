unbind C-b
set -g prefix C-a
bind C-a send-prefix

set -g base-index 1
set -g renumber-windows on
bind c new-window
bind , command-prompt -I "#W" "rename-window '%%'"

setw -g automatic-rename on
set -g allow-rename off
setw -g automatic-rename-format "#{?#{m:[0-9]*.[0-9]*,#{pane_current_command}},claude,#{b:pane_current_command}}"

set -g mouse on
set -g history-limit 50000
setw -g mode-keys vi

set -g status-position bottom
set -g status-interval 5
set -g status-justify left
set -g status-left ""
set -g status-right-length 100

set -g status-style "bg=default,fg=default"
set -g status-right "#[fg=colour0,bg=colour4,bold] %H:%M #[fg=colour0,bg=colour5,bold] %d %b "
setw -g window-status-format "#[fg=colour8] #I #W "
setw -g window-status-current-format "#[bg=colour3,fg=colour0,bold] #I #W "
set -g message-style "bg=colour0,fg=default"
set -g message-command-style "bg=colour0,fg=default"
set -g mode-style "bg=colour8,fg=default"
set -g pane-border-style "fg=colour8"
set -g pane-active-border-style "fg=colour4"
set -g display-panes-colour "colour8"
set -g display-panes-active-colour "colour4"

set -g escape-time 10
set -g focus-events on

set-environment -gr TERMINFO
